[package]
name = "davra-desktop"
description = "Davra Desktop: connect this machine's AI coding agents to your team's Davra hub"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/sherali-abdukakhkharov/ai-team"
rust-version = "1.85"
publish = false

# Standalone workspace: keeps the desktop app (and its webkit/WebView2 deps) out of the
# main workspace and out of the hub's Docker build.
[workspace]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
davra-cli = { path = "../../crates/davra-cli" }
anyhow = "1"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
